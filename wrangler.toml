# Cloudflare config for Signal Room, served on workers.dev.
# Phase 1: static site only. Vite builds the three pages into dist/.
# The Room Durable Object (`main` entry and binding) is added in Phase 2.
name = "signal-room"
compatibility_date = "2026-01-01"
workers_dev = true

[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
